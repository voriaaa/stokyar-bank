name: Update question index

on:
  push:
    branches: [ main ]
    paths: [ 'sets/**', 'tools/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate sets and rebuild index.json
        run: python3 tools/build_index.py
      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then echo "index.json unchanged"; exit 0; fi
          git config user.name "stokyar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json"
          git push
